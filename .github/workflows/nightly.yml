name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  live-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live TypeSafe smoke
        env:
          JEV_MCP_LIVE: "1"
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pytest -m "live or typesafe"
      - name: Golden evals
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python scripts/eval.py --out eval-results/local/summary.json
